name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base-for-autoscale-example-app
      REDIS_URL: redis://127.0.0.1:6379/15
      HEADLESS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Run unit and HTTP tests
        run: bundle exec rails test

      - name: Run system tests
        env:
          BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bundle exec rails test:system
